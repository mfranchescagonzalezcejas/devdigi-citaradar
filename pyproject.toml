[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devdigi-citaradar"
version = "0.0.0"
description = "Privacy-first desktop appointment monitoring — starter"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.7", "playwright>=1.50", "keyring>=25"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
